# nginx 配置 —— 托管前端静态资源，并把 /api 反代到 Node 后端
# 用法：在 docker-compose 里挂载为 nginx 容器的配置

server {
    listen 80;
    server_name _;

    # 前端静态资源（vite build 产物）
    root /usr/share/nginx/html;
    index index.html;

    # 上传/图片代理体积放大一点
    client_max_body_size 20m;

    # 静态资源强缓存（带 hash 的 js/css）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /api 反代到 Node 后端容器
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上游搜索最多 12s，给足缓冲
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    # 健康检查（可选，方便负载均衡器探活）
    location = /healthz {
        proxy_pass http://backend:3000;
    }

    # SPA 回退：所有未匹配路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
